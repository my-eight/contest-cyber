<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#020304">
    <title>Победитель подтверждён — Illidiance</title>
    <meta name="description" content="Победитель конкурса Illidiance подтвердил выполнение всех условий.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Победитель подтверждён — Illidiance">
    <meta property="og:description" content="Winner identity confirmed.">
    <meta property="og:url" content="https://my-eight.github.io/contest-cyber/confirmed/">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="boot" id="boot" role="status" aria-live="polite" aria-label="Проверка данных победителя">
      <div class="boot__noise" aria-hidden="true"></div>
      <div class="boot__frame">
        <div class="boot__header"><span>ILLIDIANCE // WINNER.OS</span><span>V.02</span></div>
        <div class="boot__core" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="boot__log">
          <span style="--delay:.4s">&gt; ACCESSING CONTEST CORE</span>
          <span style="--delay:1.25s">&gt; READING IDENTITY HASH</span>
          <span style="--delay:2.1s">&gt; CHECKING ALL 06 CHANNELS</span>
          <span style="--delay:3.1s">&gt; ACCESS REQUIREMENTS: PASSED</span>
          <span style="--delay:4.0s">&gt; WINNER STATUS: CONFIRMED</span>
        </div>
        <div class="boot__progress"><span></span></div>
        <div class="boot__footer"><span>SYS_AUTH</span><span id="boot-percent">00%</span></div>
      </div>
    </div>

    <main class="story" aria-label="Победитель конкурса подтверждён">
      <div class="grid" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="scanner" aria-hidden="true"></div>
      <span class="corner corner--tl" aria-hidden="true"></span>
      <span class="corner corner--tr" aria-hidden="true"></span>
      <span class="corner corner--bl" aria-hidden="true"></span>
      <span class="corner corner--br" aria-hidden="true"></span>
      <div class="signal signal--left" aria-hidden="true"></div>
      <div class="signal signal--right" aria-hidden="true"></div>

      <section class="identity">
        <h1 class="glitch" id="winner-name" data-text="Имя победителя">Имя победителя</h1>
      </section>
    </main>
  </body>
</html>
